
<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>MM MOVIE RECAP</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#10131b;color:#fff;
 font-family:Arial,sans-serif;overflow:hidden;
}
header{
 position:fixed;top:0;left:0;right:0;height:50px;
 background:#192131;z-index:100;
 display:flex;align-items:center;justify-content:center;
 border-bottom:2px solid #e7a535;
}
header h2{margin:0;color:#ffbd50;font-size:19px}

/* FIXED VIDEO SCREEN */
#videoDock{
 position:fixed;top:50px;left:0;right:0;
 height:34dvh;min-height:180px;max-height:360px;
 background:#05070b;z-index:90;
 display:flex;align-items:center;justify-content:center;
 overflow:hidden;border-bottom:1px solid #39465c;
 padding:5px;
}
#previewBox{
 position:relative;
 background:#000;
 overflow:hidden;
 flex:none;
 border:1px solid #343b49;
 border-radius:5px;
}
#preview{
 width:100%;height:100%;
 position:absolute;inset:0;
 object-fit:cover;
 display:block;
 background:#000;
}
#subtitle{
 position:absolute;left:50%;top:83%;
 transform:translate(-50%,-50%);
 width:90%;text-align:center;
 color:white;font-size:25px;font-weight:bold;
 line-height:1.5;padding:5px 10px;
 background:rgba(0,0,0,.65);
 border-radius:5px;
 white-space:pre-wrap;
 overflow-wrap:anywhere;
 text-shadow:1px 2px 3px #000;
 cursor:move;touch-action:none;
 user-select:none;
}
#mask{
 display:none;position:absolute;
 pointer-events:none;
 left:10%;top:75%;width:80%;height:9%;
 background:#000;filter:blur(5px);
}
#videoButtons{
 position:absolute;bottom:7px;right:7px;
 display:flex;gap:5px;z-index:5;
}
#videoButtons button{
 width:auto;padding:6px 13px;margin:0;
 background:#26374e;color:#fff;
}

/* SCROLL CONTROLS */
#controlsArea{
 position:fixed;
 top:calc(50px + 34dvh);
 left:0;right:0;bottom:0;
 overflow-y:auto;
 padding:12px 12px 35px;
 -webkit-overflow-scrolling:touch;
 overscroll-behavior:contain;
}
.panel{
 background:#1b2230;border:1px solid #303b50;
 border-radius:12px;padding:14px;margin-bottom:13px;
}
h3{font-size:16px;color:#ffc15b;margin:0 0 13px}
label{display:block;font-size:13px;margin:10px 0 5px;color:#d9e0ec}
input,select,textarea,button{
 width:100%;padding:11px;border-radius:8px;
 border:1px solid #46536b;background:#101722;
 color:#fff;font-size:14px;
}
input[type=color]{height:43px;padding:4px}
input[type=range]{padding:0;accent-color:#ffb83f}
input[type=file]{font-size:12px}
textarea{min-height:85px;resize:vertical}
button{
 background:#d99327;color:#171717;
 font-weight:bold;border:none;margin-top:9px;
 cursor:pointer;
}
button.secondary{background:#34445c;color:#fff}
button.danger{background:#a83b43;color:white}
button:disabled{opacity:.5}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.row{display:flex;align-items:center;gap:8px}
.row>*{flex:1}
input[type=checkbox]{width:auto;accent-color:#e9a535}
small{color:#aab4c5}
#status,#voiceStatus{font-size:13px;color:#64e7a0;margin-top:10px}
#subtitleList button{
 text-align:left;font-size:12px;
 white-space:normal;overflow-wrap:anywhere;
}
footer{text-align:center;color:#8894a8;padding:15px}
</style>
</head>

<div class="panel">
<h3>🎥 01. Video ထည့်ရန်</h3>

<script>
const $=id=>document.getElementById(id);
const video=$("preview");
const box=$("previewBox");
const dock=$("videoDock");
const subtitle=$("subtitle");
const mask=$("mask");

let videoURL=null;
let voiceURL=null;
let voiceBlob=null;
let subtitles=[];

let audioContext=null;
let videoSource=null;
let videoGain=null;
let voiceSource=null;
let voiceGain=null;
let audioDestination=null;
let exporting=false;
let recorder=null;

// =================================
// VIDEO PREVIEW AND RATIO
// =================================

function fitPreview(){
 const ratio=$("ratio").value.split(":").map(Number);
 const r=ratio[0]/ratio[1];

 const maxW=dock.clientWidth-14;
 const maxH=dock.clientHeight-14;

 let w=Math.min(maxW,maxH*r);
 let h=w/r;

 box.style.width=w+"px";
 box.style.height=h+"px";
}

window.addEventListener("resize",fitPreview);

$("ratio").addEventListener("change",()=>{
 fitPreview();
});

fitPreview();

$("videoFile").addEventListener("change",function(){
 const file=this.files && this.files[0];
 if(!file)return;

 if(videoURL){
  URL.revokeObjectURL(videoURL);
 }

 video.pause();
 videoURL=URL.createObjectURL(file);

 video.removeAttribute("src");
 video.load();

 video.src=videoURL;
 video.load();

 $("videoInfo").textContent="Video ဖွင့်နေပါသည်...";

 video.onloadedmetadata=()=>{
  fitPreview();
  $("videoInfo").textContent=
   "Video အဆင်သင့်ဖြစ်ပါပြီ | "+
   video.videoWidth+" × "+video.videoHeight+
   " | "+timeFmt(video.duration);
 };

 video.onerror=()=>{
  $("videoInfo").textContent=
   "Video ဖွင့်မရပါ။ အခြား MP4 ဖိုင်ဖြင့် စမ်းပါ။";
 };
});

$("play").onclick=async()=>{
 try{
  if(!video.src)return alert("Video အရင်ရွေးပါ");
  await video.play();
 }catch(e){
  alert("Video ဖွင့်မရပါ");
 }
};

$("pause").onclick=()=>video.pause();

$("filter").onchange=()=>{
 video.style.filter=$("filter").value;
};

// =================================
// SUBTITLE STYLE
// =================================

function rgba(hex,a){
 return `rgba(${parseInt(hex.slice(1,3),16)},${parseInt(hex.slice(3,5),16)},${parseInt(hex.slice(5,7),16)},${a})`;
}

function updateText(){
 subtitle.style.color=$("textColor").value;
 subtitle.style.background=rgba(
  $("bgColor").value,
  +$("bgOpacity").value/100
 );
 subtitle.style.fontSize=$("fontSize").value+"px";
 subtitle.style.width=$("textWidth").value+"%";
 subtitle.style.top=$("textY").value+"%";
 subtitle.style.left=$("textX").value+"%";
 subtitle.style.borderRadius=$("radius").value+"px";
}

[
 "textColor","bgColor","bgOpacity","fontSize",
 "textWidth","textY","textX","radius"
].forEach(id=>{
 $(id).addEventListener("input",updateText);
});

$("smaller").onclick=()=>{
 $("fontSize").value=Math.max(12,+$("fontSize").value-2);
 updateText();
};

$("bigger").onclick=()=>{
 $("fontSize").value=Math.min(65,+$("fontSize").value+2);
 updateText();
};

$("applyText").onclick=()=>{
 const t=$("textInput").value.trim();
 subtitle.textContent=t;
 $("voiceText").value=t;
 subtitles=t?[{start:0,end:999999,text:t}]:[];
};

// DRAG SUBTITLE
let dragging=false;

subtitle.addEventListener("pointerdown",e=>{
 dragging=true;
 subtitle.setPointerCapture(e.pointerId);
});

subtitle.addEventListener("pointermove",e=>{
 if(!dragging)return;

 const r=box.getBoundingClientRect();

 $("textX").value=Math.max(
  5,Math.min(95,(e.clientX-r.left)/r.width*100)
 );

 $("textY").value=Math.max(
  5,Math.min(95,(e.clientY-r.top)/r.height*100)
 );

 updateText();
});

subtitle.addEventListener("pointerup",()=>dragging=false);
subtitle.addEventListener("pointercancel",()=>dragging=false);

// =================================
// SRT
// =================================

function parseTime(t){
 const p=t.trim().replace(",",".").split(":");
 return +p[0]*3600 + +p[1]*60 + +p[2];
}

function parseSRT(data){
 return data.replace(/\r/g,"").trim()
 .split(/\n\s*\n/)
 .map(block=>{
  const lines=block.split("\n");
  const i=lines.findIndex(x=>x.includes("-->"));
  if(i<0)return null;

  const times=lines[i].split("-->");

  return {
   start:parseTime(times[0]),
   end:parseTime(times[1]),
   text:lines.slice(i+1).join("\n").trim()
  };
 }).filter(Boolean);
}

$("srtFile").onchange=async e=>{
 const file=e.target.files[0];
 if(!file)return;

 subtitles=parseSRT(await file.text());

 $("voiceText").value=subtitles.map(s=>s.text).join("\n");
 $("textInput").value=$("voiceText").value;

 renderList();
};

function renderList(){
 $("subtitleList").innerHTML="";

 subtitles.forEach((s,i)=>{
  const b=document.createElement("button");
  b.className="secondary";
  b.textContent=
   `${i+1}. ${s.start.toFixed(1)}s - ${s.end.toFixed(1)}s | ${s.text}`;

  b.onclick=()=>{
   video.currentTime=s.start;
   $("startTime").value=s.start;
   $("endTime").value=s.end;
   $("textInput").value=s.text;
   subtitle.textContent=s.text;
  };

  $("subtitleList").appendChild(b);
 });
}

$("saveSubtitle").onclick=()=>{
 const start=+$("startTime").value;
 const end=+$("endTime").value;
 const text=$("textInput").value.trim();

 if(!text||end<=start)return alert("စာသားနဲ့အချိန်စစ်ပါ");

 subtitles.push({start,end,text});
 subtitles.sort((a,b)=>a.start-b.start);
 renderList();
};

function currentSub(t){
 return subtitles.find(s=>t>=s.start&&t<s.end);
}

function updateSubtitle(){
 const s=currentSub(video.currentTime);
 subtitle.style.display=s?"block":"none";
 if(s)subtitle.textContent=s.text;
}

// =================================
// TIMELINE
// =================================

function timeFmt(t){
 if(!Number.isFinite(t))return "00:00";
 return new Date(t*1000).toISOString().slice(14,19);
}

video.addEventListener("timeupdate",()=>{
 if(!video.duration)return;

 $("seek").value=video.currentTime/video.duration*100;

 $("timeDisplay").textContent=
  timeFmt(video.currentTime)+" / "+timeFmt(video.duration);

 updateSubtitle();
});

$("seek").oninput=()=>{
 if(video.duration){
  video.currentTime=video.duration*+$("seek").value/100;
 }
};

// =================================
// MASK
// =================================

function updateMask(){
 mask.style.display=$("maskEnabled").checked?"block":"none";
 mask.style.top=$("maskY").value+"%";
 mask.style.width=$("maskW").value+"%";
 mask.style.height=$("maskH").value+"%";
 mask.style.background=$("maskColor").value;
}

[
 "maskEnabled","maskY","maskW","maskH","maskColor"
].forEach(id=>{
 $(id).addEventListener("input",updateMask);
});

// =================================
// AUDIO
// =================================

async function setupAudio(){
 if(audioContext)return;

 audioContext=new AudioContext();

 videoSource=audioContext.createMediaElementSource(video);
 videoGain=audioContext.createGain();

 voiceSource=audioContext.createMediaElementSource($("voicePreview"));
 voiceGain=audioContext.createGain();

 audioDestination=audioContext.createMediaStreamDestination();

 videoSource.connect(videoGain);
 videoGain.connect(audioDestination);
 videoGain.connect(audioContext.destination);

 voiceSource.connect(voiceGain);
 voiceGain.connect(audioDestination);
 voiceGain.connect(audioContext.destination);

 updateAudio();
}

function updateAudio(){
 if(!audioContext)return;

 videoGain.gain.value=
  $("muteOriginal").checked?0:+$("originalVolume").value/100;

 voiceGain.gain.value=+$("voiceVolume").value/100;
}

[
 "muteOriginal","originalVolume","voiceVolume"
].forEach(id=>{
 $(id).addEventListener("input",updateAudio);
});

// =================================
// VOICE FILE
// =================================

$("voiceFile").onchange=e=>{
 const f=e.target.files[0];
 if(!f)return;

 if(voiceURL)URL.revokeObjectURL(voiceURL);

 voiceBlob=f;
 voiceURL=URL.createObjectURL(f);
 $("voicePreview").src=voiceURL;

 $("voiceStatus").textContent="အသံဖိုင်ထည့်ပြီးပါပြီ";
};

$("getKey").onclick=()=>{
 window.open("https://aistudio.google.com/apikey","_blank");
};

// =================================
// GEMINI TTS
// =================================

function pcmWav(base64,mime){
 const raw=atob(base64);
 const rate=Number(
  (mime.match(/rate=(\d+)/)||[])[1]||24000
 );

 const buffer=new ArrayBuffer(44+raw.length);
 const v=new DataView(buffer);

 function str(o,s){
  for(let i=0;i<s.length;i++){
   v.setUint8(o+i,s.charCodeAt(i));
  }
 }

 str(0,"RIFF");
 v.setUint32(4,36+raw.length,true);
 str(8,"WAVE");
 str(12,"fmt ");
 v.setUint32(16,16,true);
 v.setUint16(20,1,true);
 v.setUint16(22,1,true);
 v.setUint32(24,rate,true);
 v.setUint32(28,rate*2,true);
 v.setUint16(32,2,true);
 v.setUint16(34,16,true);
 str(36,"data");
 v.setUint32(40,raw.length,true);

 for(let i=0;i<raw.length;i++){
  v.setUint8(44+i,raw.charCodeAt(i));
 }

 return new Blob([buffer],{type:"audio/wav"});
}

$("generateVoice").onclick=async()=>{
 const key=$("apiKey").value.trim();
 const text=$("voiceText").value.trim();

 if(!key||!text)return alert("API Key နဲ့ စာသားထည့်ပါ");

 const btn=$("generateVoice");
 btn.disabled=true;
 $("voiceStatus").textContent="AI အသံထုတ်နေပါသည်...";

 try{
  const response=await fetch(
   "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key="+encodeURIComponent(key),
   {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
     contents:[{
      parts:[{
       text:"Read the following Burmese text naturally and clearly: "+text
      }]
     }],
     generationConfig:{
      responseModalities:["AUDIO"],
      speechConfig:{
       voiceConfig:{
        prebuiltVoiceConfig:{
         voiceName:$("voice").value
        }
       }
      }
     }
    })
   }
  );

  const data=await response.json();

  if(!response.ok){
   throw Error(data.error?.message||"API Error");
  }

  const part=data.candidates?.[0]?.content?.parts?.find(p=>p.inlineData);

  if(!part)throw Error("Audio မရရှိပါ");

  voiceBlob=pcmWav(
   part.inlineData.data,
   part.inlineData.mimeType||"audio/L16;rate=24000"
  );

  if(voiceURL)URL.revokeObjectURL(voiceURL);

  voiceURL=URL.createObjectURL(voiceBlob);
  $("voicePreview").src=voiceURL;

  $("voiceStatus").textContent="မြန်မာ AI အသံထုတ်ပြီးပါပြီ";

 }catch(e){
  $("voiceStatus").textContent="Error: "+e.message;
 }finally{
  btn.disabled=false;
 }
};

// =================================
// EXPORT DRAWING
// =================================

function drawVideo(ctx,w,h){
 const sw=video.videoWidth;
 const sh=video.videoHeight;

 const scale=Math.max(w/sw,h/sh);
 const dw=sw*scale;
 const dh=sh*scale;

 ctx.save();
 ctx.filter=$("filter").value;
 ctx.drawImage(video,(w-dw)/2,(h-dh)/2,dw,dh);
 ctx.restore();
}

function drawExport(ctx,w,h){
 ctx.clearRect(0,0,w,h);

 drawVideo(ctx,w,h);

 if($("maskEnabled").checked){
  ctx.save();
  ctx.fillStyle=$("maskColor").value;

  const mw=w*+$("maskW").value/100;
  const mh=h*+$("maskH").value/100;

  ctx.fillRect(
   (w-mw)/2,
   h*+$("maskY").value/100,
   mw,mh
  );
  ctx.restore();
 }

 const s=currentSub(video.currentTime);

 if(s){
  const x=w*+$("textX").value/100;
  const y=h*+$("textY").value/100;
  const scale=w/box.clientWidth;

  const font=+$("fontSize").value*scale;
  const max=w*+$("textWidth").value/100;

  const lines=s.text.split("\n");
  const lh=font*1.5;

  ctx.save();
  ctx.font=`bold ${font}px Arial,sans-serif`;
  ctx.textAlign="center";
  ctx.textBaseline="middle";

  const widths=lines.map(t=>ctx.measureText(t).width);
  const bw=Math.min(max,Math.max(...widths)+20);
  const bh=lines.length*lh+12;

  ctx.fillStyle=rgba(
   $("bgColor").value,
   +$("bgOpacity").value/100
  );

  ctx.beginPath();
  ctx.roundRect(
   x-bw/2,y-bh/2,bw,bh,
   +$("radius").value*scale
  );
  ctx.fill();

  ctx.fillStyle=$("textColor").value;
  ctx.shadowColor="#000";
  ctx.shadowBlur=3;

  lines.forEach((t,i)=>{
   ctx.fillText(
    t,x,
    y+(i-(lines.length-1)/2)*lh,
    max-10
   );
  });

  ctx.restore();
 }
}

// =================================
// EXPORT VIDEO
// =================================

$("exportBtn").onclick=async()=>{
 if(!video.src||!video.videoWidth){
  return alert("Video အရင်ထည့်ပါ");
 }

 if(!Number.isFinite(video.duration)||video.duration<=0){
  return alert("Video Duration မမှန်ပါ");
 }

 if(typeof MediaRecorder==="undefined"||
    !HTMLCanvasElement.prototype.captureStream){
  return alert("ဒီ Browser မှာ Video Export မရနိုင်ပါ။ Chrome အသစ်ဖြင့် စမ်းပါ။");
 }

 const btn=$("exportBtn");
 btn.disabled=true;
 $("status").textContent="Export ပြင်ဆင်နေပါသည်...";

 try{
  await setupAudio();
  await audioContext.resume();

  const ratio=$("ratio").value.split(":").map(Number);
  const rw=ratio[0],rh=ratio[1];

  let w=720;
  let h=Math.round(w*rh/rw);

  if(h>1920){
   h=1920;
   w=Math.round(h*rw/rh);
  }

  const canvas=document.createElement("canvas");
  canvas.width=w;
  canvas.height=h;

  const ctx=canvas.getContext("2d");
  const stream=canvas.captureStream(+$("fps").value);

  audioDestination.stream.getAudioTracks().forEach(t=>{
   stream.addTrack(t);
  });

  const mime=
   MediaRecorder.isTypeSupported("video/webm;codecs=vp9,opus")?
   "video/webm;codecs=vp9,opus":"video/webm";

  recorder=new MediaRecorder(stream,{
   mimeType:mime,
   videoBitsPerSecond:+$("quality").value
  });

  let chunks=[];
  let stopped=false;
  let voiceStarted=false;
  let raf=0;

  const voice=$("voicePreview");
  const offset=+$("voiceOffset").value||0;

  video.pause();
  voice.pause();

  video.currentTime=0;

  try{voice.currentTime=0}catch(e){}

  updateAudio();

  recorder.ondataavailable=e=>{
   if(e.data.size)chunks.push(e.data);
  };

  recorder.onstop=()=>{
   const blob=new Blob(chunks,{type:"video/webm"});
   const url=URL.createObjectURL(blob);

   const a=document.createElement("a");
   a.href=url;
   a.download="MM-MOVIE-RECAP.webm";
   a.click();

   $("status").textContent="Export ပြီးပါပြီ 🎉";
   btn.disabled=false;

   stream.getTracks().forEach(t=>t.stop());
  };

  function finish(){
   if(stopped)return;
   stopped=true;
   cancelAnimationFrame(raf);
   video.pause();
   voice.pause();

   if(recorder.state!=="inactive"){
    recorder.stop();
   }
  }

  recorder.start(500);

  async function draw(){
   if(stopped)return;

   drawExport(ctx,w,h);

   if(video.currentTime>=offset&&
      voice.src&&!voiceStarted){
    voiceStarted=true;
    voice.play().catch(()=>{});
   }

   $("status").textContent=
    "Exporting: "+timeFmt(video.currentTime)+
    " / "+timeFmt(video.duration);

   if(video.ended){
    finish();
    return;
   }

   raf=requestAnimationFrame(draw);
  }

  video.addEventListener("ended",finish,{once:true});

  await video.play();
  draw();

 }catch(e){
  $("status").textContent="Export Error: "+e.message;
  btn.disabled=false;
 }
};
