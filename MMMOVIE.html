
<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movie Recap SRT Maker</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:20px;
 background:#10131c;color:#fff;
 font-family:Arial,sans-serif;
}
.container{
 max-width:600px;margin:auto;
 background:#1c2230;padding:20px;
 border-radius:16px;
}
h2{text-align:center;color:#70d6ff}
p{line-height:1.7;color:#cbd5e1}
input,button{
 width:100%;padding:15px;margin:10px 0;
 border:0;border-radius:10px;font-size:16px;
}
input{background:#30394b;color:white}
button{
 background:#1688e8;color:white;
 font-weight:bold;
}
button:disabled{opacity:.4}
#status{color:#ffd166;white-space:pre-wrap}
.small{font-size:13px;color:#9ca3af}
</style>
</head>
<body>
<div class="container">
<h2>Movie Recap SRT Maker</h2>
<p>ဗီဒီယိုရွေးပြီး Gemini ဆီ တိုက်ရိုက်မျှဝေပါ။</p>

<input type="file" id="video" accept="video/*">

<div id="info" class="small">Video မရွေးရသေးပါ။</div>

<button id="share" disabled>GEMINI သို့ VIDEO ပို့ရန်</button>

<div id="status">အသင့်ဖြစ်ပါပြီ။</div>
</div>

<script>
const videoInput=document.getElementById("video");
const shareBtn=document.getElementById("share");
const info=document.getElementById("info");
const status=document.getElementById("status");

let selectedFile=null;

videoInput.addEventListener("change",()=>{
 selectedFile=videoInput.files[0];

 if(!selectedFile)return;

 info.textContent=
 "ဖိုင်အမည်: "+selectedFile.name+
 "\nအရွယ်အစား: "+
 (selectedFile.size/1024/1024).toFixed(1)+" MB";

 const shareData={
  files:[selectedFile]
 };

 if(navigator.canShare &&
    navigator.canShare(shareData)){
  shareBtn.disabled=false;
  status.textContent="Gemini သို့ မျှဝေရန် အသင့်ဖြစ်ပါပြီ။";
 }else{
  shareBtn.disabled=true;
  status.textContent=
  "ဒီ Browser က Video Share ကို မထောက်ပံ့ပါ။ Chrome မှာဖွင့်ကြည့်ပါ။";
 }
});

shareBtn.addEventListener("click",async()=>{
 if(!selectedFile)return;

 const prompt=`
ဒီဗီဒီယိုကို အစမှအဆုံး လေ့လာပြီး
Movie Recap ပုံစံဖြင့် မြန်မာဘာသာစကားသဘာဝကျကျ
ပြန်လည်ရေးသားပေးပါ။

စည်းကမ်းများ
1. ဗီဒီယိုထဲက မြင်ကွင်းများနှင့် ဖြစ်ရပ်များကို အခြေခံပါ။
2. ဇာတ်လမ်းအစဉ်အတိုင်း ရေးပါ။
3. ဇာတ်ကောင်အမည်များကို တစ်သမတ်တည်းထားပါ။
4. စကားပြောသံကို တိုက်ရိုက်ကူးမရေးဘဲ
   ဇာတ်ကြောင်းပြောသူပုံစံဖြင့် ရေးပါ။
5. အချိန်အမှတ်များကို ဗီဒီယိုနှင့် ကိုက်ညီအောင်ထားပါ။
6. SRT Format သာ ထုတ်ပေးပါ။
7. အပိုရှင်းလင်းချက် မထည့်ပါနှင့်။

ဥပမာ -
1
00:00:00,000 --> 00:00:05,000
မြန်မာ Movie Recap ဇာတ်ကြောင်းစာသား

SRT ဖိုင်အတွက် အသင့်ဖြစ်သော စာသားကို ထုတ်ပေးပါ။
`;

 try{
  status.textContent="Android Share Menu ဖွင့်နေပါပြီ...";

  await navigator.share({
   files:[selectedFile],
   text:prompt,
   title:"Movie Recap SRT"
  });

  status.textContent=
  "Share လုပ်ပြီးပါပြီ။ Gemini ထဲမှာ Video ရောက်လာပါက Send ကိုနှိပ်ပါ။";

 }catch(error){
  if(error.name==="AbortError"){
   status.textContent="Share ကို ပယ်ဖျက်လိုက်ပါတယ်။";
  }else{
   status.textContent="Share မအောင်မြင်ပါ: "+error.message;
  }
 }
});
</script>
</body>
</html>
