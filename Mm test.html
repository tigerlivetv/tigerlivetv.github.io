<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>မုန်းမာန်ငြိုး - ဇာတ်လမ်းတွဲ</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:
        "Noto Sans Myanmar",
        "Myanmar Text",
        Arial,
        sans-serif;
    background:#050507;
    color:#fff;
    min-height:100vh;
}

/* ================= HEADER ================= */

.header{
    position:sticky;
    top:0;
    z-index:1000;
    height:64px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 18px;

    background:
        linear-gradient(
            135deg,
            #100006,
            #09090c 55%,
            #160008
        );

    border-bottom:1px solid rgba(255,30,70,.25);

    box-shadow:
        0 5px 25px rgba(0,0,0,.55);
}

.logo-title{
    font-size:21px;
    font-weight:800;
    letter-spacing:.3px;

    background:
        linear-gradient(
            90deg,
            #ff1744,
            #ff4d73,
            #fff
        );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.sub-title{
    font-size:12px;
    color:#999;
}

/* ================= HERO IMAGE ================= */

.hero-image{
    width:100%;
    padding:10px 10px 5px;

    background:
        linear-gradient(
            180deg,
            #09090b,
            #050507
        );
}

.hero-image img{
    display:block;

    width:100%;
    height:auto;

    max-height:280px;

    object-fit:cover;

    border-radius:17px;

    border:1px solid rgba(255,23,68,.35);

    box-shadow:
        0 0 20px rgba(255,23,68,.12),
        0 8px 30px rgba(0,0,0,.55);
}

/* ================= PLAYER ================= */

.player-section{
    padding:10px;
}

.player-box{
    position:relative;

    width:100%;
    max-width:900px;

    margin:auto;

    aspect-ratio:16 / 9;

    background:#000;

    border-radius:16px;

    overflow:hidden;

    border:1px solid rgba(255,23,68,.25);

    box-shadow:
        0 0 25px rgba(255,0,55,.08),
        0 12px 35px rgba(0,0,0,.55);

    display:none;
}

.player-box iframe{
    width:100%;
    height:100%;
    border:0;
    display:block;
}

/* ================= PLAYER CONTROLS ================= */

.player-controls{
    position:absolute;

    right:10px;
    bottom:10px;

    display:flex;
    gap:7px;

    z-index:10;
}

.control-btn{
    width:38px;
    height:38px;

    border:1px solid rgba(255,255,255,.15);

    border-radius:10px;

    background:rgba(0,0,0,.72);

    color:#fff;

    cursor:pointer;

    font-size:16px;

    backdrop-filter:blur(8px);

    transition:.2s;
}

.control-btn:hover{
    background:#ff1744;
    border-color:#ff1744;
}

/* ================= AD BAR ================= */

.ad-bar{
    width:calc(100% - 20px);
    max-width:900px;

    margin:10px auto;

    min-height:48px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:12px;

    background:
        linear-gradient(
            90deg,
            #100006,
            #17070b,
            #100006
        );

    border:1px solid rgba(255,23,68,.18);

    color:#777;

    font-size:13px;
}

/* ================= EPISODE HEADER ================= */

.episode-head{
    width:calc(100% - 20px);
    max-width:900px;

    margin:18px auto 10px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:14px 16px;

    border-radius:14px;

    background:
        linear-gradient(
            135deg,
            #11070a,
            #0b0b0e
        );

    border:1px solid rgba(255,23,68,.18);
}

.episode-title{
    font-size:18px;
    font-weight:800;
}

.episode-count{
    font-size:12px;
    color:#999;
}

/* ================= EPISODES ================= */

.episodes{
    width:calc(100% - 20px);
    max-width:900px;

    margin:0 auto 30px;

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:10px;
}

.episode{
    position:relative;

    padding:14px 15px;

    border-radius:13px;

    border:1px solid rgba(255,255,255,.07);

    background:
        linear-gradient(
            135deg,
            #111114,
            #0a0a0c
        );

    color:#fff;

    cursor:pointer;

    text-align:left;

    transition:
        transform .2s,
        border-color .2s,
        background .2s;

    overflow:hidden;
}

.episode::before{
    content:"";

    position:absolute;

    left:0;
    top:0;
    bottom:0;

    width:3px;

    background:#ff1744;

    opacity:.65;
}

.episode:hover{
    transform:translateY(-2px);

    border-color:
        rgba(255,23,68,.5);

    background:
        linear-gradient(
            135deg,
            #1b0b10,
            #0d0d10
        );
}

.episode:active{
    transform:scale(.98);
}

.episode-main{
    display:block;

    font-size:14px;

    font-weight:700;

    padding-left:4px;
}

.episode-sub{
    display:block;

    margin-top:4px;

    font-size:11px;

    color:#777;

    padding-left:4px;
}

/* ================= ACTIVE EPISODE ================= */

.episode.active{
    border-color:#ff1744;

    box-shadow:
        0 0 15px rgba(255,23,68,.12);
}

.episode.active::before{
    opacity:1;
}

/* ================= FOOTER ================= */

.footer{
    text-align:center;

    padding:20px 10px 30px;

    color:#555;

    font-size:11px;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

    .header{
        height:58px;
        padding:0 13px;
    }

    .logo-title{
        font-size:18px;
    }

    .sub-title{
        font-size:10px;
    }

    .hero-image{
        padding:8px 8px 3px;
    }

    .hero-image img{
        max-height:190px;
        border-radius:14px;
    }

    .player-section{
        padding:8px;
    }

    .player-box{
        border-radius:12px;
    }

    .ad-bar{
        width:calc(100% - 16px);
        min-height:44px;
        font-size:11px;
    }

    .episode-head{
        width:calc(100% - 16px);
        padding:12px 13px;
    }

    .episode-title{
        font-size:16px;
    }

    .episodes{
        width:calc(100% - 16px);

        grid-template-columns:
            repeat(2,1fr);

        gap:8px;
    }

    .episode{
        padding:12px 10px;
        border-radius:11px;
    }

    .episode-main{
        font-size:12px;
    }

    .episode-sub{
        font-size:10px;
    }
}

@media(max-width:360px){

    .episodes{
        grid-template-columns:1fr;
    }

}
</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header class="header">

    <button

</div>


<!-- ================= FOOTER ================= -->

<footer class="footer">
    မုန်းမာန်ငြိုး • ဇာတ်လမ်းတွဲ
</footer>


<script>

/* ================= PLAY VIDEO ================= */

function playVideo(title, link){

    const playerBox =
        document.getElementById("playerBox");

    const videoFrame =
        document.getElementById("videoFrame");

    videoFrame.src = link;

    playerBox.style.display = "block";

    // Player ဆီကို scroll
    playerBox.scrollIntoView({
        behavior:"smooth",
        block:"center"
    });

    // Active episode
    document.querySelectorAll(".episode")
        .forEach(function(btn){
            btn.classList.remove("active");
        });

    // နှိပ်ထားတဲ့ button ကို active ပြ
    if(event && event.currentTarget){
        event.currentTarget.classList.add("active");
    }
}


/* ================= CLOSE VIDEO ================= */

function closeVideo(){

    const playerBox =
        document.getElementById("playerBox");

    const videoFrame =
        document.getElementById("videoFrame");

    videoFrame.src = "";

    playerBox.style.display = "none";

    document.querySelectorAll(".episode")
        .forEach(function(btn){
            btn.classList.remove("active");
        });
}


/* ================= FULL SCREEN ================= */

function fullScreen(){

    const playerBox =
        document.getElementById("playerBox");

    if(playerBox.requestFullscreen){

        playerBox.requestFullscreen();

    }else if(playerBox.webkitRequestFullscreen){

        playerBox.webkitRequestFullscreen();

    }else if(playerBox.msRequestFullscreen){

        playerBox.msRequestFullscreen();

    }
}


/* ================= FULLSCREEN CHANGE ================= */

document.addEventListener(
    "fullscreenchange",
    function(){

        const playerBox =
            document.getElementById("playerBox");

        if(!document.fullscreenElement){

            playerBox.style.width = "100%";
            playerBox.style.height = "";
        }

    }
);

</script>
