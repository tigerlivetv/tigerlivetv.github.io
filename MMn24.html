<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Live Video Player</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #000;
    font-family: Arial, "Myanmar Text", sans-serif;
}


/* =========================
   VIDEO
========================= */

.video-container {

    position: relative;

    width: 100%;
    max-width: 1000px;

    aspect-ratio: 16 / 9;

    margin: 20px auto;

    background: #000;

    overflow: hidden;

    border-radius: 15px;

}


/* OK.RU */

.video-container iframe {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    border: 0;

    z-index: 1;

}


/* =========================
   RUNNING TEXT
   VIDEO အောက်ခြေနဲ့ တစ်ပြေးတည်း
========================= */

.scroll-wrapper {

    position: absolute;

    left: 0;
    bottom: 0;

    width: 100%;

    height: 34px;

    overflow: hidden;

    z-index: 9999999;

    pointer-events: none;

    background: rgba(0,0,0,0.55);

}


/* စာတန်း */

.scroll-text {

    position: absolute;

    left: 100%;

    top: 50%;

    transform: translateY(-50%);

    white-space: nowrap;

    color: #fff;

    font-size: 17px;

    font-weight: bold;

    line-height: 34px;

    text-shadow:
        0 2px 4px #000,
        0 0 8px #000;

    animation:
        runningText 12s linear infinite;

}


/* ပြေးခြင်း */

@keyframes runningText {

    0% {
        left: 100%;
    }

    100% {
        left: -100%;
    }

}


/* =========================
   FULLSCREEN
========================= */

.video-container:fullscreen {

    width: 100vw;
    height: 100vh;

    max-width: none;

    aspect-ratio: auto;

    margin: 0;

    border-radius: 0;

}


/* Fullscreen မှာလည်း အောက်ခြေနဲ့ တစ်ပြေးတည်း */

.video-container:fullscreen
.scroll-wrapper {

    left: 0;
    bottom: 0;

    width: 100%;

    height: 42px;

    z-index: 99999999;

}


.video-container:fullscreen
.scroll-text {

    font-size: 21px;

    line-height: 42px;

}


/* =========================
   LANDSCAPE
========================= */

@media
(orientation: landscape)
and (max-height: 600px) {

    .video-container {

        width: 100vw;

        height: 100vh;

        max-width: none;

        aspect-ratio: auto;

        margin: 0;

        border-radius: 0;

    }

    .scroll-wrapper {

        bottom: 0;

        height: 40px;

    }

    .scroll-text {

        font-size: 18px;

        line-height: 40px;

    }

}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .video-container {

        margin: 10px auto;

        border-radius: 10px;

    }

    .scroll-wrapper {

        height: 30px;

    }

    .scroll-text {

        font-size: 14px;

        line-height: 30px;

    }

}

</style>

</head>


<body>


<div
    class="video-container"
    id="videoBox">


    <!-- OK.RU VIDEO -->

    <iframe
        src="https://ok.ru/videoembed/16283322485483?nochat=1&autoplay=1"
        allow="autoplay; fullscreen"
        allowfullscreen>
    </iframe>


    <!-- RUNNING TEXT -->

    <div class="scroll-wrapper">

        <div class="scroll-text">

            🔴 တိုက်ရိုက်ထုတ်လွှင့်မှုကို ကြည့်ရှုနေပါသည် 🔴

        </div>

    </div>


</div>


<script>

/* Rotate လုပ်ပြီးနောက် စာတန်း Animation ပြန်စ */

window.addEventListener(
    "orientationchange",
    function() {

        setTimeout(function() {

            const text =
                document.querySelector(
                    ".scroll-text"
                );

            text.style.animation = "none";

            void text.offsetWidth;

            text.style.animation =
                "runningText 12s linear infinite";

        }, 300);

    }
);

</script>

</body>
</html>
