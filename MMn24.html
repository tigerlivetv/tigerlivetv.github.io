<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>OK Video Player</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #000;
    font-family: Arial, "Myanmar Text", sans-serif;
}


/* =========================
   PLAYER AREA
========================= */

.player {
    position: relative;

    width: 100%;
    max-width: 1000px;

    margin: 20px auto;

    background: #000;

    overflow: hidden;

    border-radius: 14px;
}


/* =========================
   VIDEO
========================= */

.video-frame {
    position: relative;

    width: 100%;

    aspect-ratio: 16 / 9;

    background: #000;

    overflow: hidden;
}


.video-frame iframe {
    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    border: 0;

    z-index: 1;
}


/* =========================
   RUNNING TEXT
========================= */

.running-bar {

    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    width: 100%;
    height: 34px;

    overflow: hidden;

    background: rgba(0,0,0,0.65);

    z-index: 999999;

    pointer-events: none;
}


.running-text {

    position: absolute;

    left: 100%;

    top: 0;

    height: 34px;

    line-height: 34px;

    white-space: nowrap;

    color: #fff;

    font-size: 16px;

    font-weight: bold;

    text-shadow:
        0 2px 4px #000,
        0 0 8px #000;

    animation:
        moveText 12s linear infinite;
}


@keyframes moveText {

    from {
        left: 100%;
    }

    to {
        left: -100%;
    }

}


/* =========================
   FULLSCREEN BUTTON
========================= */

.control-area {

    width: 100%;

    text-align: center;

    padding: 12px;

    background: #0b0b0b;
}


.fullscreen-button {

    border: 1px solid #555;

    background: linear-gradient(
        135deg,
        #333,
        #111
    );

    color: white;

    padding: 10px 24px;

    border-radius: 25px;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;
}


/* =========================
   CUSTOM FULLSCREEN
========================= */

.player.custom-fullscreen {

    position: fixed;

    top: 0;
    left: 0;

    width: 100vw;
    height: 100vh;

    max-width: none;

    margin: 0;

    border-radius: 0;

    z-index: 999999999;

    background: #000;
}


.player.custom-fullscreen
.video-frame {

    width: 100vw;

    height: 100vh;

    aspect-ratio: auto;

}


/* စာတန်းက Fullscreen မှာလည်း
   Video အောက်ဆုံးကို ကပ်နေမယ် */

.player.custom-fullscreen
.running-bar {

    position: absolute;

    bottom: 0;
    left: 0;

    width: 100%;

    height: 40px;

    z-index: 999999999;
}


.player.custom-fullscreen
.running-text {

    height: 40px;

    line-height: 40px;

    font-size: 19px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .player {

        margin: 10px auto;

        border-radius: 10px;
    }

    .running-bar {

        height: 30px;
    }

    .running-text {

        height: 30px;

        line-height: 30px;

        font-size: 14px;
    }

}


/* =========================
   LANDSCAPE
========================= */

@media
(orientation: landscape)
and (max-height: 600px) {

    .player {

        width: 100vw;

        max-width: none;

        margin: 0;

        border-radius: 0;
    }

    .video-frame {

        width: 100vw;

        height: 100vh;

        aspect-ratio: auto;
    }

    .control-area {

        position: absolute;

        right: 10px;
        top: 10px;

        width: auto;

        padding: 0;

        background: transparent;

        z-index: 9999999999;
    }

    .running-bar {

        bottom: 0;

        height: 38px;
    }

    .running-text {

        height: 38px;

        line-height: 38px;

        font-size: 17px;
    }

}

</style>
</head>


<body>


<!-- =========================
     PLAYER
========================= -->

<div class="player" id="player">


    <div class="video-frame" id="videoFrame">


        <!-- OK.RU VIDEO -->

        <iframe
            src="https://ok.ru/videoembed/16283322485483?nochat=1&autoplay=1"
            allow="autoplay"
            allowfullscreen>
        </iframe>


        <!-- RUNNING TEXT -->

        <div class="running-bar">

            <div class="running-text">

                🔴 တိုက်ရိုက်ထုတ်လွှင့်မှုကို ကြည့်ရှုနေပါသည် 🔴

            </div>

        </div>


    </div>


    <!-- CONTROL -->

    <div class="control-area">

        <button
            class="fullscreen-button"
            onclick="toggleFullscreen()">

            ⛶ Fullscreen

        </button>

    </div>


</div>


<script>

/* =========================
   CUSTOM FULLSCREEN
========================= */

function toggleFullscreen() {

    const player =
        document.getElementById("player");

    player.classList.toggle(
        "custom-fullscreen"
    );


    const button =
        document.querySelector(
            ".fullscreen-button"
        );


    if (
        player.classList.contains(
            "custom-fullscreen"
        )
    ) {

        button.innerHTML =
            "✕ ထွက်မယ်";

        /* Screen orientation lock
           support ရှိရင် Landscape */

        if (
            screen.orientation &&
            screen.orientation.lock
        ) {

            screen.orientation.lock(
                "landscape"
            ).catch(() => {});

        }

    }

    else {

        button.innerHTML =
            "⛶ Fullscreen";

        if (
            screen.orientation &&
            screen.orientation.unlock
        ) {

            screen.orientation.unlock();

        }

    }


    restartText();

}


/* =========================
   RESTART RUNNING TEXT
========================= */

function restartText() {

    const text =
        document.querySelector(
            ".running-text"
        );

    text.style.animation = "none";

    void text.offsetWidth;

    text.style.animation =
        "moveText 12s linear infinite";

}


/* =========================
   ROTATE
========================= */

window.addEventListener(
    "orientationchange",
    function() {

        setTimeout(
            restartText,
            400
        );

    }
);


/* =========================
   ESC KEY
========================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape"
        ) {

            const player =
                document.getElementById(
                    "player"
                );

            player.classList.remove(
                "custom-fullscreen"
            );

            const button =
                document.querySelector(
                    ".fullscreen-button"
                );

            button.innerHTML =
                "⛶ Fullscreen";

        }

    }
);

</script>

</body>
</html>
