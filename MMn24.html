<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no">

<title>မြန်မာ ဇာတ်လမ်းတွဲ</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    min-height:100%;
    background:#050505;
    color:white;
    font-family:
        "Noto Sans Myanmar",
        "Myanmar Text",
        Arial,
        sans-serif;
}

/* ================= HEADER ================= */

.topbar{
    width:100%;
    height:105px;
    background:#080808;
    display:flex;
    align-items:center;
    justify-content:space-between;
    overflow:hidden;
}

.title{
    width:68%;
    height:105px;
    display:flex;
    align-items:center;
    padding:0 22px;
    font-size:22px;
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.exit{
    width:32%;
    height:105px;
    background:#ed3838;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:20px;
    cursor:pointer;
}

.exit span{
    font-size:35px;
    margin-right:5px;
    font-weight:200;
}

/* ================= VIDEO ================= */

.video-box{
    width:100%;
    background:#000;
    position:relative;
    overflow:hidden;
}

.video{
    width:100%;
    aspect-ratio:16 / 9;
    display:block;
    border:0;
    background:#000;
}

/* ================= RUNNING TEXT ================= */

.running{
    position:absolute;
    left:0;
    bottom:0;
    width:100%;
    height:58px;
    background:rgba(0,0,0,.82);
    overflow:hidden;
    z-index:5;
    display:flex;
    align-items:center;
}

.running-text{
    position:absolute;
    white-space:nowrap;
    font-size:20px;
    color:white;
    animation:run 16s linear infinite;
}

@keyframes run{
    0%{
        transform:translateX(100%);
    }

    100%{
        transform:translateX(-100%);
    }
}

/* ================= BUTTON AREA ================= */

.buttons{
    width:100%;
    min-height:125px;
    background:#111;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:20px;
    padding:20px;
}

.btn{
    border:0;
    color:white;
    font-family:inherit;
    font-size:19px;
    padding:17px 28px;
    border-radius:13px;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(0,0,0,.35);
}

.back{
    background:#2869e8;
}

.full{
    background:#18a948;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

    .topbar{
        height:105px;
    }

    .title{
        width:68%;
        height:105px;
        font-size:19px;
        padding:0 12px;
    }

    .exit{
        width:32%;
        height:105px;
        font-size:18px;
    }

    .exit span{
        font-size:32px;
    }

    .running{
        height:55px;
    }

    .running-text{
        font-size:19px;
    }

    .buttons{
        min-height:115px;
        gap:18px;
        padding:18px 10px;
    }

    .btn{
        font-size:17px;
        padding:16px 18px;
    }
}

/* ================= LANDSCAPE ================= */

.player-fullscreen{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    background:#000;
    z-index:99999;
}

.player-fullscreen .topbar{
    display:none;
}

.player-fullscreen .video-box{
    width:100vw;
    height:100vh;
}

.player-fullscreen .video{
    width:100%;
    height:100%;
    aspect-ratio:auto;
}

.player-fullscreen .running{
    bottom:0;
}

.player-fullscreen .buttons{
    display:none;
}
</style>
</head>

<body>

<!-- ================= TOP ================= -->

<div class="topbar">

    <div class="title" id="videoTitle">
        မြန်မာ ဇာတ်လမ်းတွဲ အပိုင်း (၁)
    </div>

    <div class="exit" onclick="closePlayer()">
        <span>×</span>
        ပြန်ထွက်မယ်
    </div>

</div>


<!-- ================= VIDEO ================= -->

<div class="video-box" id="videoBox">

    <iframe
        id="videoFrame"
        class="video"
        src="https://ok.ru/videoembed/16283322485483?nochat=1&autoplay=1"
        frameborder="0"
        allow="autoplay; fullscreen"
        allowfullscreen>
    </iframe>

    <!-- VIDEO အောက်ခြေ Running Text -->

    <div class="running">

        <div class="running-text">
            🔴 မြန်မာ ဇာတ်လမ်းတွဲများကို ကြည့်ရှုနိုင်ပါသည် 🔴
        </div>

    </div>

</div>


<!-- ================= BUTTONS ================= -->

<div class="buttons">

    <button
        class="btn back"
        onclick="closePlayer()">
        ← ပြန်ထွက်မယ်
    </button>

    <button
        class="btn full"
        onclick="fullScreen()">
        ⛶ မျက်နှာပြင်အပြည့်
    </button>

</div>


<script>

/* ================= VIDEO LINK ================= */

const videoLink =
"https://ok.ru/videoembed/16283322485483?nochat=1&autoplay=1";


/* ================= PLAYER ================= */

function openVideo(title, link){

    document.getElementById("videoTitle")
        .innerText = title;

    document.getElementById("videoFrame")
        .src = link;

}


/* ================= CLOSE ================= */

function closePlayer(){

    document.getElementById("videoFrame")
        .src = "";

}


/* ================= FULLSCREEN ================= */

async function fullScreen(){

    const page = document.documentElement;

    const player =
        document.getElementById("videoBox");

    if(
        !document.fullscreenElement
    ){

        try{

            await page.requestFullscreen();

            player.classList.add(
                "player-fullscreen"
            );

            if(
                screen.orientation &&
                screen.orientation.lock
            ){

                await screen.orientation
                    .lock("landscape")
                    .catch(()=>{});

            }

        }catch(e){

            /* Browser fullscreen မရရင်
               CSS fullscreen */

            document.body.classList.add(
                "player-fullscreen"
            );

        }

    }else{

        try{

            await document.exitFullscreen();

        }catch(e){}

        player.classList.remove(
            "player-fullscreen"
        );

        document.body.classList.remove(
            "player-fullscreen"
        );

    }

}


/* ================= FULLSCREEN CHANGE ================= */

document.addEventListener(
    "fullscreenchange",
    function(){

        if(!document.fullscreenElement){

            document
                .getElementById("videoBox")
                .classList.remove(
                    "player-fullscreen"
                );

        }

    }
);

</script>

</body>
</html>
