<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>မြန်မာ ဇာတ်လမ်းတွဲ</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    min-height:100%;
    background:#050505;
    color:#fff;
    font-family:"Noto Sans Myanmar","Myanmar Text",Arial,sans-serif;
}

/* =========================
   TOP BAR
========================= */

.topbar{
    width:100%;
    height:52px;
    background:linear-gradient(180deg,#151515,#080808);
    display:flex;
    align-items:center;
    padding:0 14px;
    border-bottom:1px solid #242424;
}

.title{
    width:100%;
    font-size:15px;
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* =========================
   VIDEO AREA
========================= */

.video-box{
    width:100%;
    background:#000;
    position:relative;
    overflow:hidden;
}

.video{
    width:100%;
    aspect-ratio:16/9;
    display:block;
    border:0;
    background:#000;
}

/* =========================
   RUNNING TEXT
========================= */

.running{
    position:absolute;
    left:0;
    bottom:0;
    width:100%;
    height:34px;
    background:rgba(0,0,0,.78);
    overflow:hidden;
    z-index:5;
    display:flex;
    align-items:center;
    pointer-events:none;
    border-top:1px solid rgba(255,255,255,.08);
}

.running-text{
    position:absolute;
    white-space:nowrap;
    font-size:14px;
    color:#fff;
    animation:runText 18s linear infinite;
}

@keyframes runText{
    0%{
        transform:translateX(100%);
    }

    100%{
        transform:translateX(-100%);
    }
}

/* =========================
   CONTROL AREA
========================= */

.controls{
    width:100%;
    padding:14px 10px 16px;
    background:
        linear-gradient(
            180deg,
            #121212,
            #080808
        );

    display:flex;
    justify-content:center;
    align-items:center;
    gap:9px;

    border-top:1px solid #222;
}

/* =========================
   BUTTON
========================= */

.btn{
    min-width:92px;
    height:43px;

    border:none;
    border-radius:12px;

    color:#fff;
    font-family:inherit;
    font-size:13px;
    font-weight:bold;

    cursor:pointer;

    display:flex;
    justify-content:center;
    align-items:center;
    gap:5px;

    box-shadow:
        0 4px 10px rgba(0,0,0,.45);

    transition:
        transform .15s ease,
        filter .15s ease;
}

.btn:active{
    transform:scale(.94);
    filter:brightness(.85);
}

/* Back */

.back{
    background:linear-gradient(
        135deg,
        #2878ff,
        #1553c7
    );
}

/* Rotate */

.rotate{
    background:linear-gradient(
        135deg,
        #ffae24,
        #e27600
    );
}

/* Fullscreen */

.full{
    background:linear-gradient(
        135deg,
        #18bd61,
        #079342
    );
}

/* =========================
   FULLSCREEN MODE
========================= */

body.player-fullscreen{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#000;
    z-index:99999;
}

.player-fullscreen .topbar{
    display:none;
}

.player-fullscreen .video-box{
    width:100vw;
    height:100vh;
}

.player-fullscreen .video{
    width:100%;
    height:100%;
    aspect-ratio:auto;
}

.player-fullscreen .running{
    bottom:0;
}

.player-fullscreen .controls{
    display:none;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .topbar{
        height:50px;
        padding:0 12px;
    }

    .title{
        font-size:14px;
    }

    .controls{
        padding:
            13px 6px
            15px;

        gap:6px;
    }

    .btn{
        flex:1;
        min-width:0;
        height:42px;
        font-size:12px;
        border-radius:11px;
    }

    .running{
        height:32px;
    }

    .running-text{
        font-size:13px;
    }
}

/* =========================
   SMALL PHONE
========================= */

@media(max-width:360px){

    .controls{
        gap:5px;
    }

    .btn{
        font-size:11px;
        height:40px;
    }
}
</style>
</head>


<body>

<!-- =========================
     TITLE
========================= -->

<div class="topbar">

    <div
        class="title"
        id="videoTitle">

        Mi Series Official မုန်းမာန်ငြိုး အပိုင်း (၂၄)

    </div>

</div>


<!-- =========================
     VIDEO
========================= -->

<div
    class="video-box"
    id="videoBox">

    <iframe
        id="videoFrame"
        class="video"

        src="https://ok.ru/videoembed/16283322485483?nochat=1&autoplay=1"

        frameborder="0"

        allow="autoplay; fullscreen; picture-in-picture"

        allowfullscreen>

    </iframe>


    <!-- စာပြေး -->

    <div class="running">

        <div class="running-text">

            🔴ချစ်စွာသော မိဘပြည်သူ ညီအစ်ကို မောင်နှမ များ ခင်ဗျာ Mi Series Official Tiktok Channel မှမြန်မာ ဇာတ်လမ်းတွဲများကို ကြည့်ရှုနိုင်ပါပြီ ခင်ဗျာ 🔴

        </div>

    </div>

</div>


<!-- =========================
     BUTTONS
========================= -->

<div class="controls">

    <button
        class="btn back"
        onclick="closePlayer()">

        ← ပြန်ထွက်မယ်

    </button>


    <button
        class="btn rotate"
        onclick="rotatePhone()">

        ↻ လှည့်မယ်

    </button>


    <button
        class="btn full"
        onclick="fullScreen()">

        ⛶ အပြည့်

    </button>

</div>



<script>

/* =========================
   VIDEO LINK
========================= */

const videoLink =
"https://ok.ru/videoembed/16283322485483?nochat=1&autoplay=1";


/* =========================
   OPEN VIDEO
========================= */

function openVideo(title, link){

    document.getElementById("videoTitle")
        .innerText = title;

    document.getElementById("videoFrame")
        .src = link;

}


/* =========================
   CLOSE VIDEO
========================= */

function closePlayer(){

    document.getElementById("videoFrame")
        .src = "";

}


/* =========================
   PHONE ROTATE
========================= */

let isLandscape = false;


async function rotatePhone(){

    try{

        /*
         * Browser fullscreen မဝင်သေးရင်
         * orientation lock တချို့ browser တွေမှာ
         * အလုပ်မလုပ်နိုင်ပါ။
         */

        if(
            screen.orientation &&
            screen.orientation.lock
        ){

            if(!isLandscape){

                await screen.orientation
                    .lock("landscape");

                isLandscape = true;

            }else{

                await screen.orientation
                    .lock("portrait");

                isLandscape = false;

            }

        }else{

            alert(
                "ဒီဖုန်း Browser မှာ Screen လှည့်ခြင်းကို မထောက်ပံ့ပါ။"
            );

        }

    }catch(error){

        /*
         * Android Chrome တချို့မှာ
         * orientation.lock() ကို
         * fullscreen အတွင်းမှာပဲ ခွင့်ပြုပါတယ်။
         */

        try{

            if(!document.fullscreenElement){

                await document.documentElement
                    .requestFullscreen();

            }

            if(
                screen.orientation &&
                screen.orientation.lock
            ){

                if(!isLandscape){

                    await screen.orientation
                        .lock("landscape");

                    isLandscape = true;

                }else{

                    await screen.orientation
                        .lock("portrait");

                    isLandscape = false;

                }

            }

        }catch(e){

            alert(
                "ဖုန်းရဲ့ Auto Rotate ကို ဖွင့်ထားပေးပါ။"
            );

        }

    }

}


/* =========================
   FULLSCREEN
========================= */

async function fullScreen(){

    const body =
        document.body;

    if(!document.fullscreenElement){

        try{

            await document.documentElement
                .requestFullscreen();

            body.classList.add(
                "player-fullscreen"
            );


            /* Landscape */

            if(
                screen.orientation &&
                screen.orientation.lock
            ){

                await screen.orientation
                    .lock("landscape")
                    .catch(()=>{});

                isLandscape = true;

            }

        }catch(error){

            body.classList.add(
                "player-fullscreen"
            );

        }

    }else{

        try{

            await document.exitFullscreen();

        }catch(error){}


        body.classList.remove(
            "player-fullscreen"
        );

    }

}


/* =========================
   FULLSCREEN CHANGE
========================= */

document.addEventListener(
    "fullscreenchange",
    function(){

        if(!document.fullscreenElement){

            document.body.classList.remove(
                "player-fullscreen"
            );

        }

    }
);


/* =========================
   SCREEN ORIENTATION CHANGE
========================= */

if(screen.orientation){

    screen.orientation.addEventListener(
        "change",
        function(){

            if(
                screen.orientation.type
                .includes("landscape")
            ){

                isLandscape = true;

            }else{

                isLandscape = false;

            }

        }
    );

}

</script>

</body>
</html>
