<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Premium Video Player</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background:
        radial-gradient(circle at top, #202020 0%, #090909 45%, #000 100%);
    font-family: Arial, "Myanmar Text", sans-serif;
    color: white;
    min-height: 100vh;
}

.player-box {
    width: 100%;
    max-width: 900px;
    margin: 40px auto;
    background: #111;
    padding: 8px;
    border-radius: 20px;
    border: 1px solid #333;
    box-shadow:
        0 0 25px rgba(255,255,255,0.08),
        0 15px 40px rgba(0,0,0,0.8);
}

.video-container {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    border-radius: 15px;
    background: #000;
}

.video-container iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
}

.player-title {
    text-align: center;
    padding: 14px 5px 8px;
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 0.5px;
}

.live-dot {
    display: inline-block;
    width: 9px;
    height: 9px;
    background: red;
    border-radius: 50%;
    margin-right: 7px;
    box-shadow: 0 0 10px red;
    animation: blink 1s infinite;
}

@keyframes blink {
    50% {
        opacity: 0.3;
    }
}

.fullscreen-btn {
    display: block;
    width: 100%;
    max-width: 220px;
    margin: 12px auto 8px;
    padding: 12px;
    border: none;
    border-radius: 30px;
    background: linear-gradient(135deg, #333, #111);
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    border: 1px solid #555;
    transition: 0.2s;
}

.fullscreen-btn:hover,
.fullscreen-btn:focus {
    transform: scale(1.03);
    background: linear-gradient(135deg, #555, #222);
}
</style>
</head>

<body>

<div class="player-box">

    <div class="video-container" id="videoBox">

        <iframe
            id="okPlayer"
            src="https://ok.ru/videoembed/16283322485483?nochat=1&autoplay=1"
            allow="autoplay; fullscreen"
            allowfullscreen>
        </iframe>

    </div>

    <div class="player-title">
        <span class="live-dot"></span>
        LIVE VIDEO
    </div>

    <button class="fullscreen-btn" onclick="goFullscreen()">
        ⛶ Fullscreen
    </button>

</div>

<script>
function goFullscreen() {

    const player = document.getElementById("videoBox");

    if (player.requestFullscreen) {
        player.requestFullscreen();
    } 
    else if (player.webkitRequestFullscreen) {
        player.webkitRequestFullscreen();
    } 
    else if (player.msRequestFullscreen) {
        player.msRequestFullscreen();
    }
}
</script>

</body>
</html>
