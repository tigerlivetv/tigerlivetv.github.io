<script>

let hls = null;

const playerBox = document.getElementById("playerBox");
const playerTitle = document.getElementById("playerTitle");
const videoFrame = document.getElementById("videoFrame");
const hlsVideo = document.getElementById("hlsVideo");


/* =========================
   OK.RU / EMBED VIDEO
========================= */

function playVideo(title, link){

    destroyHLS();

    hlsVideo.style.display = "none";
    videoFrame.style.display = "block";

    videoFrame.src = link;

    playerTitle.textContent = title;

    playerBox.style.display = "block";

    setTimeout(() => {
        playerBox.scrollIntoView({
            behavior:"smooth",
            block:"start"
        });
    },100);
}


/* =========================
   HLS LIVE CHANNEL
========================= */

function playHLS(title, stream){

    videoFrame.src = "about:blank";
    videoFrame.style.display = "none";

    hlsVideo.style.display = "block";

    playerTitle.textContent = title;

    playerBox.style.display = "block";

    destroyHLS();

    /*
       Browser supports native HLS
       e.g. Safari / iPhone
    */

    if(
        hlsVideo.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ){

        hlsVideo.src = stream;

        hlsVideo.play().catch(() => {});

    }

    /*
       Chrome / Android / Firefox
       use HLS.js
    */

    else if(
        typeof Hls !== "undefined" &&
        Hls.isSupported()
    ){

        hls = new Hls({
            enableWorker:true,
            lowLatencyMode:true
        });

        hls.loadSource(stream);

        hls.attachMedia(hlsVideo);

        hls.on(
            Hls.Events.MANIFEST_PARSED,
            function(){

                hlsVideo.play().catch(() => {});

            }
        );

        hls.on(
            Hls.Events.ERROR,
            function(event,data){

                console.log(
                    "HLS Error:",
                    data
                );

            }
        );

    }

    else{

        alert(
            "ဒီ Browser မှာ Live Stream ဖွင့်လို့မရပါ။"
        );

    }

    setTimeout(() => {

        playerBox.scrollIntoView({
            behavior:"smooth",
            block:"start"
        });

    },100);
}


/* =========================
   DESTROY HLS
========================= */

function destroyHLS(){

    try{

        hlsVideo.pause();

    }catch(e){}

    hlsVideo.removeAttribute("src");

    hlsVideo.load();

    if(hls){

        hls.destroy();

        hls = null;

    }
}


/* =========================
   CLOSE PLAYER
========================= */

function closeVideo(){

    destroyHLS();

    videoFrame.src = "about:blank";

    playerBox.style.display = "none";

}


/* =========================
   FULLSCREEN
========================= */

function fullScreen(){

    const box = document.querySelector(".video-wrap");

    if(!document.fullscreenElement){

        box.requestFullscreen().catch(() => {});

    }else{

        document.exitFullscreen();

    }

}

</script>
