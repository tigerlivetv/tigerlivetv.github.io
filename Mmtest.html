<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>မုန်းမာန်ငြိုး - ဇာတ်လမ်းတွဲ</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:
        "Noto Sans Myanmar",
        "Myanmar Text",
        Arial,
        sans-serif;
    background:#080808;
    color:#fff;
}

/* ================= HEADER ================= */

.header{
    position:sticky;
    top:0;
    z-index:1000;

    height:62px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 18px;

    background:#0d0d0f;

    border-bottom:1px solid #27272a;

    box-shadow:0 4px 18px rgba(0,0,0,.5);
}

.logo-title{
    font-size:21px;
    font-weight:bold;
    color:#fff;
}

.sub-title{
    color:#999;
    font-size:13px;
}


/* ================= HERO ================= */

.hero-image{
    padding:12px 10px 6px;
    background:#080808;
}

.hero-image img{
    display:block;

    width:100%;
    max-width:900px;

    height:260px;

    margin:auto;

    object-fit:cover;

    border-radius:15px;

    border:1px solid #292929;
}


/* ================= PLAYER ================= */

.player-section{
    padding:10px;
}

.player-box{
    position:relative;

    width:100%;
    max-width:900px;

    aspect-ratio:16/9;

    margin:auto;

    background:#000;

    border-radius:14px;

    overflow:hidden;

    border:1px solid #252525;

    display:none;
}

.player-box iframe{
    width:100%;
    height:100%;
    border:0;
}


/* ================= PLAYER BUTTON ================= */

.player-controls{
    position:absolute;

    right:10px;
    bottom:10px;

    display:flex;

    gap:7px;

    z-index:10;
}

.control-btn{
    width:38px;
    height:38px;

    border:1px solid #444;

    border-radius:9px;

    background:rgba(0,0,0,.8);

    color:#fff;

    cursor:pointer;

    font-size:16px;
}

.control-btn:hover{
    background:#e50914;
    border-color:#e50914;
}


/* ================= AD ================= */

.ad-bar{
    width:calc(100% - 20px);
    max-width:900px;

    min-height:48px;

    margin:10px auto;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#101012;

    border:1px solid #242426;

    border-radius:10px;

    color:#777;

    font-size:13px;
}


/* ================= EPISODE TITLE ================= */

.episode-head{
    width:calc(100% - 20px);
    max-width:900px;

    margin:18px auto 12px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:13px 15px;

    background:#101012;

    border:1px solid #242426;

    border-radius:11px;
}

.episode-title{
    font-size:18px;
    font-weight:bold;
}

.episode-count{
    color:#888;
    font-size:12px;
}


/* ================= EPISODES ================= */

.episodes{
    width:calc(100% - 20px);
    max-width:900px;

    margin:auto;

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:12px;

    padding-bottom:30px;
}


/* ================= EPISODE CARD ================= */

.episode{
    position:relative;

    overflow:hidden;

    padding:0;

    background:#111113;

    border:1px solid #29292c;

    border-radius:13px;

    color:#fff;

    text-align:left;

    cursor:pointer;

    transition:.2s;

    appearance:none;
}

.episode:hover{
    border-color:#555;

    transform:translateY(-2px);

    box-shadow:
        0 8px 20px rgba(0,0,0,.35);
}


/* ================= EPISODE IMAGE ================= */

.episode-image{
    position:relative;

    width:100%;

    aspect-ratio:16/9;

    overflow:hidden;

    background:#1a1a1c;
}

.episode-image img{
    width:100%;
    height:100%;

    display:block;

    object-fit:cover;

    transition:.3s;
}

.episode:hover .episode-image img{
    transform:scale(1.04);
}


/* ================= PLAY ICON ================= */

.play-icon{
    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    width:46px;
    height:46px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:rgba(0,0,0,.72);

    border:1px solid rgba(255,255,255,.3);

    font-size:18px;

    opacity:.95;
}


/* ================= EPISODE INFO ================= */

.episode-info{
    padding:11px 12px 13px;
}

.episode-main{
    display:block;

    font-size:14px;

    font-weight:bold;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.episode-sub{
    display:block;

    margin-top:4px;

    color:#777;

    font-size:11px;
}


/* ================= ACTIVE ================= */

.episode.active{
    border-color:#e50914;

    box-shadow:
        0 0 15px rgba(229,9,20,.15);
}

.episode.active::after{
    content:"ကြည့်နေသည်";

    position:absolute;

    top:8px;
    left:8px;

    padding:4px 8px;

    border-radius:5px;

    background:#e50914;

    color:#fff;

    font-size:10px;
}


/* ================= FOOTER ================= */

.footer{
    text-align:center;

    padding:15px 10px 30px;

    color:#555;

    font-size:11px;
}


/* ================= MOBILE ================= */

@media(max-width:600px){

    .header{
        height:58px;
        padding:0 13px;
    }

    .logo-title{
        font-size:18px;
    }

    .sub-title{
        font-size:10px;
    }

    .hero-image{
        padding:8px 8px 5px;
    }

    .hero-image img{
        height:190px;
        border-radius:12px;
    }

    .player-section{
        padding:8px;
    }

    .player-box{
        border-radius:11px;
    }

    .episode-head{
        width:calc(100% - 16px);
        padding:11px 13px;
    }

    .episodes{
        width:calc(100% - 16px);

        grid-template-columns:
            repeat(2,1fr);

        gap:8px;
    }

    .episode{
        border-radius:10px;
    }

    .episode-info{
        padding:9px 9px 11px;
    }

    .episode-main{
        font-size:12px;
    }

    .episode-sub{
        font-size:9px;
    }

    .play-icon{
        width:38px;
        height:38px;

        font-size:15px;
    }
}
</style>
</head>

<script>

/* ================= PLAY VIDEO ================= */

function playVideo(button, title, link){

    const playerBox =
        document.getElementById("playerBox");

    const videoFrame =
        document.getElementById("videoFrame");

    videoFrame.src = link;

    playerBox.style.display = "block";


    /* Active Episode */

    document
        .querySelectorAll(".episode")
        .forEach(function(item){

            item.classList.remove("active");

        });

    button.classList.add("active");


    /* Scroll Player */

    setTimeout(function(){

        playerBox.scrollIntoView({
            behavior:"smooth",
            block:"center"
        });

    },100);

}


/* ================= CLOSE ================= */

function closeVideo(){

    const playerBox =
        document.getElementById("playerBox");

    const videoFrame =
        document.getElementById("videoFrame");

    videoFrame.src = "";

    playerBox.style.display = "none";


    document
        .querySelectorAll(".episode")
        .forEach(function(item){

            item.classList.remove("active");

        });

}


/* ================= FULLSCREEN ================= */

function fullScreen(){

    const playerBox =
        document.getElementById("playerBox");

    if(playerBox.requestFullscreen){

        playerBox.requestFullscreen();

    }
    else if(playerBox.webkitRequestFullscreen){

        playerBox.webkitRequestFullscreen();

    }
    else if(playerBox.msRequestFullscreen){

        playerBox.msRequestFullscreen();

    }

}

</script>
